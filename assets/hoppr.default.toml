# hoppr — configuration
#
# This file IS the hoppr. Everything about how this store behaves lives here,
# in `.hoppr/` beside the data, and travels with it.
#
#   .hoppr/hoppr.toml          this file — settings
#   .hoppr/.env                API keys (gitignored; never commit one)
#   .hoppr/CLAUDE.md           generated — describes the store to an agent
#   .hoppr/curated/prompts/    the prompts that drive curation; edit them
#   .hoppr/curated/tables/     table schemas
#   .hopprignore               which files to index (beside the data)
#
# Every value below is the default. Delete a line to keep it.
# Precedence: defaults < ~/.hoppr/hoppr.toml < this file < HOPPR_* env < flags

# ── what this hoppr is ────────────────────────────────────────────────
[hopper]
# name / source / profile / raw_mode are written by `hoppr new` and are NEVER
# inherited from the global config — a shared file must not be able to
# silently repoint every hoppr at one corpus.
curation = "notes"               # notes | papers | agents | index-only | minimal
max_file_mb = 20
use_gitignore = true             # honour the folder's own .gitignore

# ── what gets built, and how a query is answered ──────────────────────
[retrieval]
# keyword is not a toggle: it is free, and it is the floor every other arm
# falls back to.
embeddings = true                # vector search (~200MB model, local)
graph = false                    # typed entities and relations — see [graph]

[retrieval.extract]
# The expensive parts of "index this folder". Off means the work never happens.
ocr = true                       # local OCR over images — free, ~800ms each
image_llm = true                 # a vision model describing what an image SHOWS
pdf = true                       # PDF text layers
pdf_ocr = true                   # rasterise + OCR a PDF with no text layer
office = true                    # Word, Excel, PowerPoint

[retrieval.rerank]
# rrf needs no calibration between bm25's unbounded negatives and cosine's
# 0..2, which is why it is the default. `weighted` normalises per query and is
# therefore less stable. `none` takes one arm as-is — useful for debugging.
method = "rrf"                   # rrf | weighted | none
k = 60                           # rrf damping; larger = flatter
# [retrieval.rerank.weights]
# keyword = 1
# vector = 1

# ── typed entities and relations ──────────────────────────────────────
[graph]
# Off by default and schema-driven on purpose: a relation vocabulary is
# domain-specific, and inventing one for a folder of papers produces confident
# nonsense. Define the types you actually have.
#
# These entries are PROMPTS, not validation rules — each `description` is given
# to the model verbatim as the definition of what counts. That is where the
# accuracy comes from: "person" retrieves everything and nothing; the sentence
# below is a decision procedure.
entity_types = ["person", "org", "project", "tool", "concept"]
min_mentions = 2                 # a hapax is noise

# [[graph.entity_types]]
# name = "person"
# description = "A named individual who participated — not an author cited in passing."
#
# [[graph.relations]]
# name = "works_on"
# from = ["person"]
# to   = ["project"]
# description = "Sustained involvement, not a single mention in the same sentence." 

# ── the wiki ──────────────────────────────────────────────────────────
[wiki]
layout = "karpathy"              # karpathy (curated/wiki/…) | flat
page_types = ["source", "concept"]   # implemented types only
concept_min_sources = 4          # a tag earns a concept page at this many
generate_index = true            # index.md is deterministic, not model-written
claude_md = true
# The highest-leverage string here. An agent that knows "support transcripts
# from 2024-25, use for policy precedent" retrieves differently from one that
# knows only "documents". Empty = generated from the source and profile.
orientation = ""

# ── curation ──────────────────────────────────────────────────────────
[curate]
fast_batch = 8                   # captures per model call
max_raw_chars = 8000
deep_cron = "0 3 * * *"          # nightly; catches up on wake if missed
deep_only_if_idle = true
auto_merge = false               # propose, never rewrite
dedup_threshold = 0.93
# Curated paths the agent must never rewrite, relative to curated/.
# Hand-editing a page already pins it; this is the pin you set BEFORE writing.
protect = []                     # e.g. ["wiki/overview.md", "skills/**"]

[curate.budget]
max_usd_per_day = 2.0
max_calls_per_run = 200

# ── intake ────────────────────────────────────────────────────────────
[intake]
inbox = "inbox"
redact = true                    # scrub secrets BEFORE anything is written
debounce_ms = 20000              # quiet period before a fast pass
max_wait_ms = 300000             # …but never wait longer than this

# ── skills ────────────────────────────────────────────────────────────
[skills]
enabled = true
mine = "auto"                    # auto | targeted | off
# targets = ["how we cut a release", "debugging flaky tests"]
seed = ["comms-preferences", "working-agreements"]
min_evidence = 3                 # recurrences before a proposal
min_confidence = 0.6
refresh_after = 5                # new sessions before proposing an update
auto_install = false             # ALWAYS review — a skill changes every session
default_target = "~/.claude/skills"

# ── tables ────────────────────────────────────────────────────────────
[tables.tags]
vocabulary_size = 150            # existing tags fed back as preferred vocabulary
max_new_tags_per_item = 2
max_tags_per_item = 7
pinned = ["work", "personal"]
stoplist = ["misc", "other", "stuff", "general"]

# ── models ────────────────────────────────────────────────────────────
[llm]
provider = "auto"                # auto | openrouter | anthropic | openai | ollama | claude-cli
# fast_provider = "openrouter"   # tagging, extraction — high volume
# quality_provider = "anthropic" # synthesis, taxonomy, skill mining
# Model ids are resolved AFTER the provider, from a per-provider table.
# [llm.models]
# fast = "anthropic/claude-haiku-4.5"
# quality = "anthropic/claude-sonnet-5"

[embed]
provider = "local"               # local | none | <remote>
model = "Xenova/bge-small-en-v1.5"
dim = 384

# ── search ranking ────────────────────────────────────────────────────
[search]
default_scope = "curated"        # widens automatically when nothing is curated
limit = 10
max_snippet_chars = 400
recency_half_life_days = 180

[search.tier_boost]
curated = 1.5                    # a page outranks the capture it came from

# ── git ───────────────────────────────────────────────────────────────
[git]
mode = "auto"                    # one commit per curate pass; `git diff` is the review UI
track_raw = true
max_blob_mb = 5

# ── daemon ────────────────────────────────────────────────────────────
[daemon]
host = "127.0.0.1"
port = 7717
